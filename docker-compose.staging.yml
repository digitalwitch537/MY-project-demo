name: mern-staging

services:
  mongo:
    image: mongo:7.0
    restart: "no"
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: products_staging
    volumes:
      - mongo_staging_data:/data/db
    networks:
      - stagingnet
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/mern-backend:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      NODE_OPTIONS: --max-old-space-size=256
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/products_staging?authSource=admin
    networks:
      - stagingnet
    mem_limit: 384m
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/mern-frontend:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGING_PORT:-8080}:8080"
    networks:
      - stagingnet
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  stagingnet:
    name: mern-staging-net

volumes:
  mongo_staging_data:
    name: mern-staging-mongo-data
